description = "Content-free Apple Push Notification service client (token-based ES256 auth, HTTP/2) for the Whispera backend."

[lib]
name = "whispera_apns"

[dependencies]
whispera-proto.workspace = true
serde.workspace = true
serde_json.workspace = true
