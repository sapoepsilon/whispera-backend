[workspace]
resolver = "2"
members = [
    "crates/proto",
    "crates/auth",
    "crates/store",
    "crates/relay",
    "crates/apns",
    "crates/apns-mock",
    "crates/stt",
    "crates/server",
    "crates/dev-idp",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/sapoepsilon/whispera-backend"
rust-version = "1.85"

# Shared versions. Crates add other dependencies in their own Cargo.toml.
[workspace.dependencies]
whispera-proto = { path = "crates/proto" }
whispera-auth = { path = "crates/auth" }
whispera-store = { path = "crates/store", default-features = false }
whispera-relay = { path = "crates/relay" }
whispera-apns = { path = "crates/apns" }
whispera-apns-mock = { path = "crates/apns-mock" }
whispera-stt = { path = "crates/stt" }
whispera-dev-idp = { path = "crates/dev-idp" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
p256 = { version = "0.13", features = ["ecdsa", "pem", "pkcs8"] }
sha2 = "0.10"
base64 = "0.22"
hex = "0.4"
rand = "0.8"
subtle = "2"
