[package]
name = "whispera-apns-mock"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Local stand-in for Apple's APNs HTTP endpoint: records every push as JSONL (dev/e2e only)."

[lib]
name = "whispera_apns_mock"

[[bin]]
name = "whispera-apns-mock"
path = "src/main.rs"

[dependencies]
serde_json.workspace = true
tokio.workspace = true
p256.workspace = true
base64.workspace = true
axum = "0.8"

[dev-dependencies]
rand.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json"] }
