[package]
name = "whispera-store"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Persistence for the Whispera server: accounts, devices and the E2E relay mailbox (SQLite or Postgres via sqlx)."

[features]
default = ["sqlite"]
sqlite = ["sqlx/sqlite"]
postgres = ["sqlx/postgres"]

[dependencies]
whispera-proto.workspace = true
thiserror.workspace = true
tracing.workspace = true
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "any", "migrate", "macros"] }

[dev-dependencies]
tokio.workspace = true
tempfile = "3"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "any"] }
